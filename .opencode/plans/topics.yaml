# Типичные темы краш-тестов
# Используется командой write-crash-plan: topic=<id>

- id: empty-fields
  title: "Пустые обязательные поля"
  description: "Не заполнять обязательные поля, пытаться перейти дальше"
  checks:
    - "Поле не имеет * / (required) но является обязательным — пользователь узнаёт только при сабмите"
    - "Кнопка Next/Submit не disabled — но после клика тост/ошибка"
    - "После тоста — данные не теряются"

- id: invalid-data
  title: "Невалидные данные"
  description: "Отрицательные числа, нули, спецсимволы, очень длинные строки, XSS"
  checks:
    - "Цены: -100, 0, 999999999, abc, <script>"
    - "Имена: пустая строка, пробелы, 1000 символов, HTML/XSS"
    - "Даты: Start > End, прошедшая дата, 31 февраля"
    - "Email: без @, без домена, специальные символы"

- id: navigation-hijack
  title: "Нарушение навигации"
  description: "Прыжки по шагам, Back после сабмита, дабл-клик, сайдбар в произвольном порядке"
  checks:
    - "Двойной клик на Next/Submit — только один запрос"
    - "Back после успешного сабмита — повторная отправка?"
    - "Прыжок через сайдбар на будущий шаг — disabled?"
    - "Переход на шаг назад — данные сохранились?"

- id: network-failure
  title: "Отказ сети / API"
  description: "Таймауты, 500, 403, пустые ответы, потеря соединения"
  checks:
    - "GET /user/profile — 500 — что показывает приложение?"
    - "POST /event/create — таймаут — кнопка разблокируется?"
    - "Все запросы заблокированы — белый экран или тост?"
    - "Медленный ответ — spinner/loading?"

- id: auth-bypass
  title: "Обход авторизации"
  description: "Действия без токена, с просроченным токеном, без storageState"
  checks:
    - "Открыть /profile без авторизации — редирект на /login?"
    - "Открыть /event/create без авторизации — редирект?"
    - "Просроченный token в localStorage — что происходит?"
    - "Удалить token в середине флоу — приложение ломается?"

- id: state-mutation
  title: "Мутация состояния"
  description: "Изменение localStorage/URL между шагами, потеря данных"
  checks:
    - "Удалить activeLanguage из localStorage между шагами"
    - "Изменить URL вручную /profile → /profile/nonexistent"
    - "Обновить страницу (F5) на середине визарда — данные сохранились?"
    - "Открыть ту же страницу в двух вкладках"
